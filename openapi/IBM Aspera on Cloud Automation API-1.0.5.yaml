        value:
          description: Header value
          type: string
          example: text/html
    createActionTransfer:
      title: Creates a new action to send a file or folder
      description: >-
        The node_id and file_id are required parameters in the payload to create
        a transfer action.
      type: object
      required:
        - data
        - source
        - destination
        - type
        - node_id
        - file_id
        - step_id
        - paths
      properties:
        data:
          description: Data in the payload
          type: object
          properties:
            content_encryption:
              description: Encryption information
              type: object
              properties:
                encryption:
                  description: Method of content encryption.
                  type: string
                  enum:
                    - AES-128
                    - AES-256
                    - AES-192
                    - none
                  default: none
                  example: AES-128
                apply_protection:
                  description: Apply protection to the file transfer
                  type: boolean
                  example: true
                password:
                  description: >-
                    Password for the transfer, used if the value of
                    apply_protection 
                     is true.
                  type: string
                  example: lHF%SHJrjk
            destination:
              description: Object with details about destination
              type: object
              properties:
                file_id:
                  description: >-
                    ID of file to be transferred. Required for a transfer source
                    that is a workspace or node.
                  type: string
                  example: '1818255'
                file_name:
                  description: Name of file to be transferred.
                  type: string
                  example: folder1
                node_id:
                  description: >-
                    ID of destination node. Required for a transfer source that
                    is a workspace or node.
                  type: string
                  example: '95'
                node_name:
                  description: Name of the source node for the transfer.
                  type: string
                  example: Tor02_node
                paths:
                  description: Array of objects that contain source paths for transfer
                  type: array
                  items:
                    $ref: '#/components/schemas/Paths'
                type:
                  description: >-
                    Type of destination for transfer. Allowed values: workspace,
                    node.
                  type: string
                  enum:
                    - workspace
                    - node
                  example: workspace
                workspace_id:
                  description: ID of workspace at destination
                  type: string
                  example: '638'
                workspace_name:
                  description: Name of workspace at destination
                  type: string
                  example: dev_workspace
            file_attributes:
              description: File attributes are defined
              type: boolean
              example: true
            conditions_type:
              description: |-
                The conditions type for the transfer. Allowed values: all_new 
                 (transfers all new files), custom (adds custom filtering conditions). 
                 Default: all-new.
              type: string
              enum:
                - custom
                - all_new
              default: all_new
              example: custom
            join_type:
              description: |-
                The logical operator that joins multiple conditions. Allowed 
                 values: and, or.
              type: string
              enum:
                - and
                - or
              example: and
            conditions:
              description: Filtering conditions for the transfer
              type: array
              items:
                $ref: '#/components/schemas/Conditions'
            resume_policy:
              description: Policy for resuming a transfer
              type: object
              properties:
                destination_file_options:
                  description: >-
                    Processing options for file at destination. Allowed values:
                    overwrite_always, 
                     overwrite_both_newer_and_different, overwrite_different, overwrite_newer, overwrite_never.
                  type: string
                  enum:
                    - “overwrite_always”
                    - “overwrite_both_newer_and_different”
                    - “overwrite_different”
                    - “overwrite_newer”
                    - “overwrite_never”
                  example: “overwrite_always”
                difference_check:
                  description: |-
                    Type of check used to validate content. Allowed values: 
                     attrs, none.
                  type: string
                  enum:
                    - attrs
                    - none
                  example: attrs
                resume_partials:
                  description: Partial transfers should be resumed
                  type: boolean
                  example: true
            source:
              description: Source of the transfer
              type: object
              properties:
                type:
                  description: 'Source type. Allowed values: workspace, node.'
                  type: string
                  enum:
                    - workspace
                    - node
                  example: node
                file_id:
                  description: ID of file that is transferred
                  type: string
                  example: '1730980'
                file_name:
                  description: Name of file that is transferred
                  type: string
                  example: 01-test
                node_id:
                  description: ID of the source node.
                  type: string
                  example: '95'
                node_name:
                  description: Name of the source node.
                  type: string
                  example: Tor02_node
                paths:
                  description: Array of objects that contain source paths for transfer
                  type: array
                  items:
                    $ref: '#/components/schemas/Paths'
                token:
                  description: Token for the transfer
                  type: string
                  example: <token>
            source_archive:
              description: Archive policy for the transfer source
              type: object
              properties:
                archive_option:
                  description: >-
                    Archive policy for the package at the source. Allowed
                    values: 
                     none, archive, delete.
                  type: string
                  enum:
                    - none
                    - archive
                    - delete
                  example: none
                delete_empty_subdirectories:
                  description: Delete empty subdirectories at source after transfer
                  type: boolean
                  example: false
                move_after_transfer:
                  description: >-
                    Archive location in case of archiving. (location relative to
                    source path)
                  type: string
                  example: /abc/def
                remove_skipped:
                  description: >-
                    Archive location in case of delete source. to remove the
                    skipped files
                  type: boolean
                  example: true
            substitutions:
              description: |-
                Data for substitution variables from previous steps, 
                 inserted into the message
              type: array
              items:
                $ref: '#/components/schemas/substitutionVariables'
            timeout:
              description: >-
                The maximum time the action can take before it is marked as
                failed. Default: 24 hours (in seconds), mimimum 1 hour (in
                seconds), maximum: 48 hours (in seconds).
              type: integer
              default: 86400
              example: 144000
            target_rate:
              description: Rate and retry conditions for the transfer
              type: object
              properties:
                rate:
                  description: Transfer rate, in bytes per second
                  type: integer
                  default: 10000
                  example: 10000
                allow_retry:
                  description: Whether to allow retry of a failed transfer
                  type: boolean
                  default: true
                  example: true
                retry_attempts:
                  description: Number of times Automation can retry the transfer
                  type: integer
                  default: 3
                  example: 3
                retry_interval:
                  description: |-
                    Length of time to wait before retrying the transfer, in 
                     seconds
                  type: integer
                  default: 30
                  example: 30
        step_id:
          description: ID for step that contains the action
          type: string
          example: '1314'
        type:
          description: |-
            Action type. For an action that transfers a file, the type is 
             always transfer.
          type: string
          example: transfer
    Conditions:
      type: object
      required:
        - field_name
        - field_type
        - match_type
        - value
        - size
      properties:
        field_name:
          description: >-
            Name of the condition field. Allowed values: file_name,
            extension_name, file_size
          type: string
          enum:
            - file_name
            - extension_name
            - file_size
          example: file_name
        field_type:
          description: >-
            Type of the condition field. Allowed values: string, byte. The
            value 
             'string' is used with a field_name of file_name or extension_name. The value 
             'byte' is used with a field_name of file_size.
          type: string
          enum:
            - string
            - byte
          example: string
        match_type:
          description: >-
            Logic for the matching condition. Allowed values: includes,
            excludes, 
             matches, regex, equal, greater_than, less_than, greater_than_or_equal, 
             less_than_or_equal. A value of includes, excludes, matches, or regex is used with 
             a field_name of file_name or extension_name. A value of equal, greater_than, 
             less_than, greater_than_or_equal or less_than_or_equal is used with a field_name 
             of file_size.
          type: string
          enum:
            - includes
            - excludes
            - matches
            - regex
            - equal
            - greater_than
            - less_than
            - greater_than_or_equal
            - less_than_or_equal
          example: includes
        value:
          description: Value of the condition
          type: string
          example: .jpg
        size:
          description: Size of file being transferred, in bytes
          type: integer
          example: 500000
    Recipients:
      type: object
      required:
        - id
        - type
      properties:
        id:
          description: Recipient ID
          type: string
          example: '3201'
        type:
          description: 'User type of recipient. Allowed values: user, admin.'
          type: string
          enum:
            - user
            - admin
          example: user
        name:
          description: Name of recipient
          type: string
          example: Adam Smith
    bccRecipients:
      required:
        - id
        - type
      type: object
      description: |-
        Properties of user (recipient) who receives notification that 
         the package is sent
      properties:
        id:
          description: Recipient ID
          type: string
          example: '3202'
        type:
          description: 'User type of recipient. Allowed values: user, admin.'
          type: string
          enum:
            - user
            - admin
          example: admin
        name:
          description: Name of recipient
          type: string
          example: Benita Tyme
    uploadNotificationRecipients:
      required:
        - id
        - type
      type: object
      description: |-
        Properties of user (recipient) who receives notification that 
         the package is sent
      properties:
        id:
          description: Recipient ID
          type: string
          example: '3203'
        type:
          description: 'User type of recipient. Allowed values: user, admin.'
          type: string
          enum:
            - user
            - admin
          example: admin
        name:
          description: Name of recipient
          type: string
          example: Constance Upshaw
    downloadNotificationRecipients:
      required:
        - id
        - type
      type: object
      description: |-
        Properties of user (recipient) who receives notification that 
         the package is sent
      properties:
        id:
          description: Recipient ID
          type: string
          example: '3204'
        type:
          description: 'User type of recipient. Allowed values: user, admin.'
          type: string
          enum:
            - user
            - admin
          example: user
        name:
          description: Name of recipient
          type: string
          example: David Vale
    Paths:
      title: Paths
      type: object
      required:
        - source
      description: Source paths for the transfer
      properties:
        source:
          description: >-
            Describes the source path. If "/", all files transfer from the same
            folder location.
          type: string
          example: /
    updateState:
      title: Updates the state of the workflow
      required:
        - event
      properties:
        event:
          description: |-
            Request a state change. Allowed values: save_as_draft, activate, 
             deactivate. To save a workflow in a state that can be edited, use 'save_as_draft'. 
             To launch running instances of the workflow, use 'activate'. To stop all running 
             instances of a workflow, use 'deactivate'; this event allows you to edit the workflow.
          type: string
          enum:
            - save_as_draft
            - activate
            - deactivate
          example: save_as_draft
  parameters:
    status:
      name: status
      in: query
      description: |-
        Status of the workflow. Allowed values: executing, failed, complete, 
         canceled.
      required: false
      schema:
        type: string
        enum:
          - executing
          - failed
          - complete
          - canceled
      example: executing
    workflowID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: false
      schema:
        type: string
      example: '362'
    workflow_ID:
      name: workflow_id
      in: query
      description: ID of the workflow
      required: true
      schema:
        type: string
      example: '362'
