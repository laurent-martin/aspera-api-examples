    actionData:
      type: object
      properties:
        id:
          description: ID of the action
          type: string
          example: '1071'
        name:
          description: Name of the action. Null if no name is assigned.
          type: string
          example: 'null'
        type:
          description: >-
            Type of action, which can include a workflow trigger. Allowed
            values: 
             transfer, send_package, api, email_notification, manual, shared_inbox, watch_folder, 
             scheduled.
          enum:
            - transfer
            - send_package
            - api
            - email_notification
            - manual
            - shared_inbox
            - watch_folder
            - scheduled
          type: string
          example: scheduled
        data:
          description: Detailed action data
          type: object
          properties:
            start_date:
              description: Date and time when the scheduled trigger is initiated
              type: string
              format: date-time
              example: '2019-03-13T05:32:28.784Z'
            substitutions:
              description: Data for substitution variables included in the message
              type: array
              items:
                $ref: '#/components/schemas/substitutionVariables'
            repeat_interval:
              description: Details about the workflow trigger (action) of type 'scheduled'
              type: object
              properties:
                repeat_type:
                  description: Unit of time for the scheduled trigger
                  type: string
                  example: minutes
                repeat_number:
                  description: Number of times to trigger the workflow
                  type: integer
                  example: 20
                days_of_the_week:
                  description: Days on which to trigger the workflow, if applicable
                  type: string
                  example: '[]'
        outputs:
          description: |-
            Describes the format of action outputs that can be added 
             as substitution variables in subsequent actions.
          type: object
          properties:
            timestamp:
              description: Transfer timestamp output
              type: string
              example: iso8601
    201-Step:
      title: Success response
      type: object
      properties:
        id:
          description: ID of the new step
          type: string
          example: '1454'
        name:
          description: Name of the step. Null if not declared in the request.
          type: string
          example: notification step
        action_order:
          description: Order of actions in a step, listed by action ID
          type: array
          items:
            type: string
          example:
            - 1273, 1262, 1274
    substitutionVariables:
      type: object
      properties:
        template:
          description: |-
            Template for insertion of substitution variables in the 
             message
          type: string
          example: '{{step_id_1357.action_id_1409.node_id}}'
        path:
          description: Path to the substitution variable
          type: array
          items:
            $ref: '#/components/schemas/substitutionVariablesPath'
    substitutionVariablesPath:
      type: object
      properties:
        name:
          description: >-
            Name for the path. Allowed values, source, file_id, node_id,
            message, 
             value, conditions.
          type: string
          enum:
            - source
            - file_id
            - node_id
            - message
            - value
            - conditions
          example: message
        type:
          description: |-
            Path type. Allowed values: map, array. Note that path type of map 
             indicates a key:value pair.
          type: string
          enum:
            - map
            - array
          example: map
        index:
          description: Index of the substitution variable
          type: integer
          example: 0
    201-ActionAPI:
      title: Success response
      type: object
      properties:
        id:
          description: Action ID
          type: string
          example: '647'
        name:
          description: 'Name assigned to the action. Default: null.'
          type: string
          example: Get status
        type:
          description: |-
            The type of action. For an action that calls an API, type is 
             always api.
          type: string
          example: api
        data:
          type: object
          properties:
            method:
              description: 'API method. Allowed values: get, post, put, delete.'
              type: string
              example: get
            endpoint:
              description: Endpoint for the API call
              type: string
              format: uri
              example: https://api.asperafiles.com/automation/v1/workflows
            authentication:
              description: Authentication for the request.
              type: object
              properties:
                type:
                  description: "Authentication type required by the API. Allowed values: \n bearer, basic, none. Default: none. Use 'bearer' for bearer token \n authentication, for basic authentication, 'none' for no authentication \n method.\_\n \n The bearer authentication\_type requires a token parameter. Allowed values: \n none, bearer, basic. Default: none. The basic authentication type\_requires username \n and password parameters. The 'none' authentication type does not require \n additional parameters."
                  type: string
                  enum:
                    - none
                    - bearer
                    - basic
                  default: none
                  example: bearer
                token:
                  description: Bearer token for the bearer authentication type
                  type: string
                  example: ''
                username:
                  description: Username for the basic authentication type
                  type: string
                  example: jabrams
                password:
                  description: Password for the basic authentication type
                  type: string
                  example: llk3lk4&W@
            headers:
              description: Headers returned in the response
              type: array
              items:
                $ref: '#/components/schemas/Headers'
            substitutions:
              description: Data for substitution variables included in the message
              type: array
              items:
                $ref: '#/components/schemas/substitutionVariables'
        outputs:
          description: |-
            Describes the format of action outputs that can be added 
             as substitution variables in subsequent actions.
          type: object
          properties:
            status:
              description: Status output
              type: string
              example: string
            response_code:
              description: Response code output
              type: string
              example: integer
            response_body:
              description: Response body output
              type: string
              example: hash
    201-ActionTransfer:
      title: Success response
      type: object
      properties:
        id:
          description: Action ID
          type: string
          example: '647'
        name:
          description: Action Name
          type: string
          example: first transfer
        type:
          description: |-
            The type of action. For an action that transfers a file, 
             the type is always transfer.
          type: string
          example: transfer
        data:
          description: Data for the action
          type: object
          properties:
            target_rate:
              properties:
                rate:
                  description: Target rate for the transfer, in seconds
                  type: integer
                  example: 10000
                  default: 10000
                allow_retry:
                  description: Whether to allow retry of a failed transfer
                  type: boolean
                  example: true
                  default: true
                retry_attempts:
                  description: Number of allowed retry attempts for the transfer
                  type: integer
                  example: 3
                  default: 3
                retry_interval:
                  description: |-
                    Interval, in seconds, after which Automation retries 
                     the transfer
                  type: integer
                  example: 30
                  default: 30
            content_encryption:
              properties:
                encryption:
                  description: Type of content encryption.
                  type: string
                  enum:
                    - aes-128
                    - aes-256
                    - aes-192
                    - none
                  example: aes-128
                apply_protection:
                  description: Apply protection to the file transfer
                  type: boolean
                  example: true
                password:
                  description: >-
                    Password for the transfer, used if the value of
                    apply_protection 
                     is true.
                  type: string
                  example: lHF%SHJrjk
            resume_policy:
              properties:
                resume_partials:
                  description: Resume partial transfers for a paused transfer
                  type: boolean
                  example: true
                difference_check:
                  description: |-
                    Type of check used to validate content. Allowed values: 
                     attrs, none.
                  type: string
                  enum:
                    - attrs
                    - none
                  example: attrs
                destination_file_options:
                  description: |-
                    Processing options for file at destination. Allowed values: 
                     overwrite_always, overwrite_both_newer_and_different, overwrite_different, 
                     overwrite_newer, overwrite_never.
                  type: string
                  enum:
                    - “overwrite_always”
                    - “overwrite_both_newer_and_different”
                    - “overwrite_different”
                    - “overwrite_newer”
                    - “overwrite_never”
                  example: “overwrite_always”
            file_attributes:
              description: ''
              type: boolean
              example: true
            source_archive:
              description: Archive policy for the transfer source
              type: object
              properties:
                archive_option:
                  description: >-
                    Archive policy for the package at the source. Allowed
                    values: 
                     none, archive, delete.
                  type: string
                  enum:
                    - none
                    - archive
                    - delete
                  example: archive
                delete_empty_subdirectories:
                  description: Delete empty subdirectories at source after transfer
                  type: boolean
                  example: false
                move_after_transfer:
                  description: >-
                    Archive location in case of archiving. (location relative to
                    source path)
                  type: string
                  example: /abc/def
                remove_skipped:
                  description: >-
                    Archive location in case of delete source. to remove the
                    skipped files
                  type: boolean
                  example: true
            conditions_type:
              description: |-
                The conditions type for the transfer. Allowed values: all_new 
                 (transfers all new files), custom (adds custom filtering conditions). 
                 Default: all-new.
              type: string
              enum:
                - custom
                - all_new
              default: all_new
              example: custom
            join_type:
              description: 'The logical operator. Allowed values: and, or'
              type: string
              example: and
            conditions:
              description: Filtering conditions for the transfer
              type: array
              items:
                $ref: '#/components/schemas/Conditions'
            substitutions:
              description: |-
                Data for substitution variables from previous steps, 
                 inserted into the message
              type: array
              items:
                $ref: '#/components/schemas/substitutionVariables'
            source:
              properties:
                type:
                  description: 'Source type for transfer. Allowed values: node, workspace.'
                  type: string
                  example: node
                node_id:
                  description: ID of node
                  type: string
                  example: 4724
                node_name:
                  description: Name of node
                  type: string
                  example: Lor_3_node
                workspace_id:
                  description: ID of workspace
                  type: string
                  example: 367
                workspace_name:
                  description: Name of workspace
                  type: string
                  example: editing_team
                file_name:
                  description: Filename for file being transferred
                  type: string
                  example: 1112_m
                file_id:
                  description: File ID for file being transferred
                  type: string
                  example: '1755550'
                paths:
                  description: Array of objects that contain source paths for transfer
                  type: array
                  items:
                    $ref: '#/components/schemas/Paths'
        outputs:
          description: >-
            Describes the format of action outputs that can be added as
            substitution variables in subsequent actions.
          type: object
          properties:
            status:
              description: Status output
              type: string
              example: string
            transfer_uuid:
              description: Transfer UUID output
              type: string
              example: string
            timestamp:
              description: Transfer timestamp output
              type: string
              example: iso8601
    Step:
      required:
