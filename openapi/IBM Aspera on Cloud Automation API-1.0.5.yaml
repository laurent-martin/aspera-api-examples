                  description: "Authentication type required by the API. Allowed values: \n bearer, basic, none. Default: none. Use 'bearer' for bearer token \n authentication, for basic authentication, 'none' for no authentication \n method.\_\n \n Allowed values: none, bearer, basic. Default: none. The basic authentication type\_\n requires a username parameter and a password parameter. The bearer \n authentication\_type requires a token parameter. The 'none' authentication \n type does not require additional parameters."
                  type: string
                  enum:
                    - none
                    - bearer
                    - basic
                  default: none
                  example: bearer
                token:
                  description: Bearer token for the bearer authentication type
                  type: string
                  example: ''
                username:
                  description: Username for the basic authentication type
                  type: string
                  example: jabrams
                password:
                  description: Password for the basic authentication type
                  type: string
                  example: llk3lk4&W@
            endpoint:
              description: Endpoint for the request
              type: string
              format: uri
              example: https://www.google.com
            substitutions:
              description: |-
                Data for substitution variables from previous steps, 
                 inserted into the message
              type: array
              items:
