openapi: 3.0.0
info:
  title: Automation API
  description: >-
    The Automation API allows you to create multistep workflows with
    event-based 
     triggers cued to IBM Aspera on Cloud endpoints. The first step in your workflow contains the trigger, 
     which can be a person or an API, a series of scheduled times, a new file added to a folder, or a 
     package arriving in a shared inbox, or the deletion of a file or folder. 

    The rest of the steps in the workflow contain one or more actions. An
    action 
     can transfer a file, send a package, call an API, notify users, create custom substitution variables, or create a folder. 
     After you activate the workflow, you can monitor active jobs and update 
     the state of the workflow, which allows you to make edits. Note: Each workflow 
     must contain at least one action that transfers a file or sends a package. 
     
     Access Control: You must include a JSON Web Token (bearer token) in the authorization 
     header of your request. 
     
     For additional information, visit the Aspera Developer Center at https://www.ibm.developer.com/aspera/
  version: 1.0.5
servers:
  - url: https://api.ibmaspera.com/automation/v1
    description: The Automation App production server
paths:
  /workflows:
    get:
      tags:
        - workflows
      summary: Get workflows
      description: >-
        Returns all workflows. Access Control: You must include a JSON Web
        Token 
         (bearer token) in the authorization header of your request.
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-Workflows'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
    post:
      tags:
        - workflows
      summary: Create a workflow
      description: |-
        Creates a new workflow. Once you have created the workflow, 
         you can create one or more steps within the workflow. Access Control: You must 
         include a JSON Web Token (bearer token) in the authorization header of your request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Workflow'
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
  /workflows/:id:
    get:
      tags:
        - workflows
      summary: Gets a workflow
      description: >-
        Returns a workflow with a unique ID. Access Control: You must include a
        JSON Web Token 
         (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow to get
        - in: query
          name: workflow_version_id
          schema:
            type: string
          required: false
          description: Numeric ID of the workflow version to get
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-Workflows'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
    put:
      tags:
        - workflows
      summary: Update a workflow
      description: |-
        Allows user to edit a workflow with a unique ID. Access Control: 
         You must include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow to get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflow'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
    delete:
      tags:
        - workflows
      summary: Delete a workflow
      description: >-
        Allows user to delete a workflow with a find ID. Access Control: You
        must 
         include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow to delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
  /workflows/:id/update_state:
    put:
      tags:
        - workflows
      summary: Update the workflow state
      description: >-
        Updates the state of a workflow with a unique ID. Access Control: You
        must 
         include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow to edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateState'
            example:
              event: activate
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
  /workflows/:id/launch:
    post:
      tags:
        - workflows
      summary: Launch a workflow
      description: |-
        For a workflow with a manual trigger, launches (activates) a workflow. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID of the workflow that you intend to launch
          example: '2116'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
  /workflows/:id/cancel_instances:
    put:
      tags:
        - workflows
      summary: Cancel all jobs
      description: |-
        Cancels all running jobs of an active workflow with a particular ID. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the workflow for which you are cancelling all running jobs
          example: '1120'
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '404':
          description: Not Found. The workflow ID submitted in the request is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Workflows'
  /workflows/:id/delete_instances:
    delete:
      tags:
        - workflows
      summary: Delete all jobs
      description: |-
        Deletes all jobs for an active workflow with a particular ID. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID of the workflow for which you are cancelling all running jobs
          example: '1120'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '404':
          description: Not Found. The workflow ID submitted in the request is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Workflows'
  /workflow_instances:
    get:
      tags:
        - workflow_instances
      summary: Get jobs
      description: |-
        Returns all jobs of active workflows - whether running, complete, 
         or failed. If you add query parameters (for a particular workflow ID or status), 
         returns a filtered subset of jobs associated with that workflow or 
         status. Access Control: You must include a JSON Web Token (bearer token) in the 
         authorization header of your request.
      parameters:
        - $ref: '#/components/parameters/workflowID'
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-WorkflowInstances'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
  /workflow_instances/:id:
    get:
      tags:
        - workflow_instances
      summary: Get a job
      description: |-
        Returns a job with a unique ID. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: '8588'
          required: true
          description: Numeric ID of the job to get
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstances'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
    delete:
      tags:
        - workflow_instances
      summary: Delete a job
      description: |-
        Allows user to delete a job with a unique ID. Access Control: 
         You must include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the job to delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
    put:
      tags:
        - workflow_instances
      summary: Cancel a job
      description: |-
        Cancels a running job with a unique ID. Doing so 
         allows you to edit the workflow that generated the job. Access Control: 
         You must include a JSON Web Token (bearer token) in the authorization header of 
         your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the job to cancel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cancelWorkflowInstance'
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
  /steps:
    post:
      tags:
        - steps
      summary: Create a step
      description: |-
        Creates a step in the workflow. Each step can hold one or more 
         actions, which you create with POST /actions after creating the step. Steps 
         can be re-ordered within the workflow after they are created, using a PUT /steps/:id 
         request. Access Control: You must include a JSON Web Token (bearer token) in the 
         authorization header of your request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Step'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-Step'
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
  /steps/:id:
    get:
      tags:
        - steps
      summary: Get a step
      description: |-
        Returns the data for a step with a unique ID, such as the actions 
         associated with that step. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: '1076'
          required: true
          description: Numeric ID of the step to get
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-StepsID'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
    put:
      tags:
        - steps
      summary: Update a step
      description: >-
        Allows user to edit the details of a step with a unique ID. Access
        Control: 
         You must include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow that is edited
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createStepRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
    delete:
      tags:
        - steps
      summary: Delete a step
      description: |-
        Allows user to delete a step with a unique ID. Access Control: You must 
         include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the step to delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
  /actions:
    post:
      tags:
        - actions
      summary: Create an action
      description: |-
        Creates an action that can be used in one or more workflows. Actions
         can transfer to a node or workspace, send a package, call an API, or notify users.
         An action is contained in a step; a step can contain multiple actions. An example request
         body for a transfer action is defined below. For examples of the other action types, go to
         https://developer.ibm.com/aspera/docs/automation-api-guide/automation-api-action-examples/.
         Access Control: You must include a JSON Web Token (bearer token) in the authorization header of your request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createActionTransfer'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/201-ActionTransfer'
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
  /actions/:id:
    get:
      tags:
        - actions
      summary: Get an action
      description: |-
        Returns data for an action with a unique ID. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            example: '1076'
          required: true
          description: Numeric ID of the action to get
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/actionData'
    put:
      tags:
        - actions
      summary: Update an action
      description: |-
        Allows user to edit the values of an action with a unique ID. 
         Access Control: You must include a JSON Web Token (bearer token) in the authorization 
         header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow to delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createActionAPI'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
    delete:
      tags:
        - actions
      summary: Delete an action
      description: |-
        Allows user to delete a action with a unique ID. Access Control: 
         You must include a JSON Web Token (bearer token) in the authorization header of your request.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the action to delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
  /workflow_permissions:
    get:
      tags:
        - workflow_permissions
      summary: Get workflow permissions
      description: >
        "Returns all workflow permissions. Access Control: You must include a
        JSON Web Token (bearer token) in the authorization header of your
        request."
      parameters:
        - $ref: '#/components/parameters/workflow_ID'
      responses:
        '200':
          description: OK - Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/200-WorkflowPermissions'
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '500':
          description: Internal Server Error
    post:
      tags:
        - workflow_permissions
      summary: Create a workflow permission
      description: >
        "Creates a new permission for a workflow. Access Control: You must
        include a JSON Web Token (bearer token) in the authorization header of
        your request."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createWorkflowPermissionRequest'
      responses:
        '201':
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPermissions'
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
  /workflow_permissions/:id:
    put:
      tags:
        - workflow_permissions
      summary: Update a workflow permission
      description: >
        "Allows the user to edit a workflow permission with a unique ID. Access
        Control: You must include a JSON Web Token (bearer token) in the
        authorization header of your request."
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow permission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateWorkflow'
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad Request. The payload may not be in the correct format (JSON
            format).
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
        '422':
          description: Unprocessable Entity. Incorrect parameter information in payload.
    delete:
      tags:
        - workflow_permissions
      summary: Delete a workflow permission
      description: >
        "Allows user to delete a workflow permission with a unique ID. Access
        Control: You must include a JSON Web Token (bearer token) in the
        authorization header of your request."
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: Numeric ID of the workflow permission to delete
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden. The bearer token is missing or incorrect.
components:
  schemas:
    200-WorkflowInstances:
      title: Success response
      description: Returned data for all jobs
      type: object
      properties:
        offset:
          description: |-
            Controls pagination of the response, in coordination with 
             the limit parameter. If offset = 0 and limit = 20, returns results 1-20 
             (first page of results). If offset = 1 and limit = 20, returns results 
             21-40 (second page of results)
          type: integer
          default: 0
          example: 0
        limit:
          description: Maximum number of workflows for which to return data
          type: integer
          example: 20
        first:
          description: The link for the first page of results
          type: object
          properties:
            href:
              description: URL for the first page of results
              type: string
              format: uri
              example: >-
                http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=0
        last:
          description: The link for the last page of results
          type: object
          properties:
            href:
              description: URL for the last page of results
              type: string
              format: uri
              example: >-
                http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=20
        next:
          description: The link for the second page of results
          type: object
          properties:
            href:
              description: URL for the second page of results
              type: string
              format: uri
              example: >-
                http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=1
        workflow_instances:
          description: Array of jobs
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstances'
    WorkflowInstances:
      type: object
      description: Job data
      properties:
        id:
          description: ID for the workflow instance
          type: string
          example: '8588'
        workflow_version_id:
          description: >-
            ID for the workflow version that is used in generating this workflow
            instance
          type: string
          example: '8588'
        instance_id:
          description: UUID. Can be used for debugging purposes.
          type: string
          example: f5d74b9c-e2de-4782-9a44-e65b4857d98b
        organization_id:
          description: ID of organization from which the workflow originates
          type: string
          example: '58'
        user_id:
          description: User ID of user initiating the workflow instance
          type: string
          example: '3201'
        workflow_id:
          description: ID of the workflow that generates the workflow instance
          type: string
          example: '699'
        step_id:
          description: ID of step in the workflow that generates the workflow instance
          type: string
          example: '1290'
        step_name:
          description: |-
            Name of step in the workflow that is currently active. If 
             the workflow is complete or failed, step_name is the name of the final 
             step in the workflow.
          type: string
          example: transfer step
        status:
          description: >-
            Status of the workflow instance. Allowed values: executing, failed,
            complete, canceled.
          enum:
            - executing
            - failed
            - complete
            - canceled
          type: string
          example: complete
        status_details:
          description: Error message - only returned for a failed workflow instance
          type: string
          example: No valid permission on the source node available
        launch_time:
          description: Original start time for activation of the workflow
          type: string
          format: date-time
          example: '2019-03-17T07:07:15.000Z'
        state_change_time:
          description: |-
            Time the workflow instance state was changed--for example, 
             with a PUT request.
          type: string
          format: date-time
          example: '2019-03-17T07:07:22.000Z'
        workflow_name:
          description: Name of the workflow
          type: string
          example: media content
    200-WorkflowPermissions:
      title: Success response
      description: Returned data for all jobs
      type: object
      properties:
        workflow_permissions:
          description: Array of jobs
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPermissions'
    WorkflowPermissions:
      title: Success response
      type: object
      properties:
        id:
          description: Workflow Permission ID
          type: string
          example: '26'
        user_id:
          description: User ID
          type: string
          example: '26'
        workflow_id:
          description: Workflow ID
          type: string
          example: '26'
        manage_jobs:
          description: Whether there is permission to manage jobs
          type: boolean
          example: true
        duplicate:
          description: Whether there is permission to duplicate workflows
          type: boolean
          example: true
        updated_at:
          description: Time workflow is updated
          type: string
          format: date-time
          example: '2019-01-10T21:25:24.000Z'
        created_at:
          description: Time workflow permission is created
          type: string
          format: date-time
          example: '2019-01-10T21:25:24.000Z'
    200-Workflows:
      title: Success response
      type: object
      properties:
        offset:
          description: |-
            Controls pagination of the response, in coordination with 
             the limit parameter. If offset = 0 and limit = 20, returns results 1-20 
             (first page of results). If offset = 1 and limit = 20, returns results 
             21-40 (second page of results)
          type: integer
          default: 0
          example: 0
        limit:
          description: Maximum number of workflows for which to return data
          type: integer
          example: 20
        first:
          description: The link for the first page of results
          type: object
          properties:
            href:
              description: URL for the first page of results
              type: string
              format: uri
              example: >-
                http://api.qa.ibmaspera.com/automation/v1/workflow_instances?limit=20&offset=0
        last:
          description: The link for the last page of results
          type: object
          properties:
            href:
              description: URL for the last page of results
              type: string
              format: uri
              example: >-
