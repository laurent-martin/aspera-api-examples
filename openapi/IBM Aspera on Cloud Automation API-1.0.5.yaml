                  type: Email
            failed:
              description: >-
                Hashes of recipient data for workflow notifications with a
                status of failed
              type: array
              items:
                type: object
                properties:
                  id:
                    description: ID of user or group, or email of user
                    type: string
                  type:
                    description: Type of recipient
                    type: string
                    enum:
                      - User
                      - Group
                      - Email
              example:
                - id: example@email.com
                  type: Email
            completed:
              description: >-
                Hashes of recipient data for workflow notifications with a
