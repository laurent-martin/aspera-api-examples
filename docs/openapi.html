<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="openapi.svg">
  <title>OpenAPI Viewer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="openapi.css">
  <script src="openapi.js" defer></script>

  <!-- Prevent page caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>

  <div id="form-screen" class="container">
    <header>
      <h1>📖 OpenAPI Viewer</h1>
      <p class="subtitle">Enter a spec URL to browse interactive documentation</p>
    </header>
    <div id="form-container">
      <div class="card form-card">
        <p>Enter an OpenAPI / Swagger spec URL:</p>
        <input
          id="spec-input"
          type="text"
          class="text-input"
          placeholder="https://example.com/openapi.json"
        />
        <button id="load-btn" class="btn">Load Documentation</button>
        <div class="error" id="error"></div>
      </div>
    </div>
    <footer>
      <p>IBM Aspera API Examples Repository</p>
    </footer>
  </div>

  <nav id="top-bar" hidden>
    <a href="index.html" class="brand" title="All Aspera APIs">
      <img src="openapi.svg" alt="">
      OpenAPI Viewer
    </a>
    <div id="tag-filter" hidden>
      <button type="button" class="tag-button" popovertarget="tag-list">
        Tags <span id="tag-count"></span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <div id="tag-list" popover></div>
    </div>
  </nav>

  <div id="redoc-container" hidden></div>

</body>

</html>
