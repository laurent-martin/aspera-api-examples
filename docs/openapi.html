<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="openapi.svg">
  <title>OpenAPI Viewer</title>
  <script>
    // Use the light/dark mode selected in the Redoc viewer, else the OS one
    try {
      const mode = localStorage.getItem("redoc.colorMode");
      if (mode === "light" || mode === "dark") document.documentElement.classList.add(mode);
    } catch { }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="openapi.css">
  <script src="openapi.js" defer></script>

  <!-- Prevent page caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body>

  <nav id="top-bar" class="top-bar">
    <a href="index.html" class="brand" title="All Aspera APIs">
      <img src="openapi.svg" alt="">
      Aspera APIs
    </a>
    <div class="top-bar-actions">
      <div id="tag-filter" hidden>
        <button type="button" class="tag-button" popovertarget="tag-list">
          Tags <span id="tag-count"></span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
        <div id="tag-list" popover></div>
      </div>
      <a href="https://github.com/laurent-martin/aspera-api-examples" class="top-link" title="GitHub repository"
        aria-label="GitHub repository">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
        </svg>
      </a>
    </div>
  </nav>

  <main id="form-screen" class="page page-narrow">
    <header class="page-header">
      <h1>Open an API description</h1>
      <p class="subtitle">Enter the URL of an OpenAPI or Swagger file, JSON or YAML, to browse its documentation.</p>
    </header>
    <form id="spec-form" class="url-form">
      <input id="spec-input" type="url" class="text-input" placeholder="https://example.com/openapi.yaml"
        aria-label="OpenAPI file URL" autofocus />
      <button class="btn" type="submit">Open</button>
    </form>
    <div class="error" id="error"></div>
  </main>

  <div id="redoc-container" hidden></div>

</body>

</html>
