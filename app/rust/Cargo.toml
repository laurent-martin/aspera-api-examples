[package]
name = "samples"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.34"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# serde_yaml is deprecated: maintained fork with the same API
serde_yaml_ng = "0.10.0"
url = "2.5.8"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tokio = { version = "1.53.1", features = ["full"] }
prost = "0.14.4"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
# crypto backend: aws-lc-rs (also used by rustls in reqwest)
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
uuid = { version = "1.26.1", features = ["v4"] }
anyhow = "1.0.104"
regex = "1.13.1"
ssh2 = "0.9.6"

# send SIGINT to the daemon
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bin]]
name = "server"
path = "src/examples/server.rs"
[[bin]]
name = "faspex5"
path = "src/examples/faspex5.rs"
[[bin]]
name = "aoc"
path = "src/examples/aoc.rs"
[[bin]]
name = "server_cmd"
path = "src/examples/server_cmd.rs"

